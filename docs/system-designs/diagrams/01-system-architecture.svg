<text x="1152" y="42" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#12635D" text-anchor="end">CURRENT • SOURCE VERIFIED</text>
<text x="48" y="88" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#172E3D" text-anchor="start">01  System architecture &amp; local deployment</text>
<text x="48" y="118" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#4C626D" text-anchor="start">One application backend; three Compose services; external media, AI and email integrations.</text>
