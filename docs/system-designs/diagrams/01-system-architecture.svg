<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">Current system architecture and local deployment</title>
<desc id="description">React browser calls one Express API. Route modules use services and Prisma/PostgreSQL. External integrations are Azure or local media, Gemini and SMTP. Compose runs three containers.</desc>
