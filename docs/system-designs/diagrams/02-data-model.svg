<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">Current six-entity data model</title>
<desc id="description">Each donated item belongs to exactly one donor and zero or one program. An item has zero or more status records and attributes, both cascade-deleted with the item. User has no foreign key to Donor; code matches emails.</desc>
<rect x="0" y="0" width="1200" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.4"/>
<text x="48" y="42" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#12635D" text-anchor="start">BWORKS  /  MATERIAL DERAILLEUR</text>
<text x="1152" y="42" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#12635D" text-anchor="end">CURRENT • SOURCE VERIFIED</text>
<text x="48" y="88" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#172E3D" text-anchor="start">02  Data model &amp; ownership</text>
<text x="48" y="118" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#4C626D" text-anchor="start">Entity relationships from the Prisma schema; representative fields keep the view readable.</text>
