<text x="776" y="380" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#12635D" text-anchor="start">1</text>
<text x="1020" y="482" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#12635D" text-anchor="start">0..*</text>
<text x="917" y="418" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#4C626D" text-anchor="start">attributes</text>
<text x="48" y="680" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#245D89" text-anchor="start">User ↔ Donor: email lookup only</text>
<text x="48" y="703" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#245D89" text-anchor="start">No database relationship</text>
<text x="862" y="705" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#4C626D" text-anchor="start">Status + attribute deletion</text>
<text x="862" y="727" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#4C626D" text-anchor="start">cascades from the item</text>
<text x="48" y="735" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#4C626D" text-anchor="start">PK primary key  •  FK foreign key  •  UQ unique  •  ? nullable</text>
<polyline points="48,754 1152,754" fill="none" stroke="#A2B3BA" stroke-width="1"/>
<text x="48" y="776" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#4C626D" text-anchor="start">Source: server/prisma/schema.prisma; donorRoutes.ts /me. Numeric multiplicities: 1 required, 0..1 optional, 0..* many. 3c75abdc.</text>
